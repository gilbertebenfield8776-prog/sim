<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Private Room</title>
    <style>
        /* বেসিক সেটআপ */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #fff; overflow: hidden; }
        
        /* ব্যাকগ্রাউন্ড ইমেজ (ব্লার করা) */
        .bg { 
            position: absolute; width: 100%; height: 100%; 
            background: url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?q=80&w=1929&auto=format&fit=crop') no-repeat center center/cover; 
            filter: blur(10px) brightness(0.3); z-index: -1; transform: scale(1.1); 
        }
        
        /* গ্লাসমরফিজম (Glassmorphism) কন্টেইনার */
        .container { display: flex; justify-content: center; align-items: center; height: 100%; padding: 20px; }
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; padding: 40px 30px; text-align: center; 
            max-width: 380px; width: 100%; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); 
            transform: translateY(20px); opacity: 0; animation: fadeIn 0.8s forwards ease-out; 
        }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        
        /* প্রোফাইল ছবি এবং লাইভ ডট */
        .profile-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 20px; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #ff2a85; padding: 4px; }
        .live-dot { 
            position: absolute; bottom: 8px; right: 8px; width: 16px; height: 16px; 
            background: #00ff00; border-radius: 50%; border: 2px solid #222; 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); } 
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 0, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); } 
        }
        
        /* টেক্সট ডিজাইন */
        h2 { margin: 0 0 10px; font-size: 26px; font-weight: 600; letter-spacing: 1px; color: #fff;}
        p { font-size: 15px; color: #ccc; margin-bottom: 30px; line-height: 1.6; }
        
        /* বাটন ডিজাইন */
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .btn { flex: 1; padding: 14px 0; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-yes { background: linear-gradient(45deg, #ff4b4b, #ff2a85); color: white; box-shadow: 0 4px 15px rgba(255, 75, 75, 0.4); }
        .btn-yes:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 75, 75, 0.6); }
        .btn-no { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-no:hover { background: rgba(255, 255, 255, 0.2); }
        
        /* স্টেপ ২ - ফেক লোডিং (প্রাথমিকভাবে লুকানো থাকবে) */
        #step2 { display: none; }
        .loader { 
            border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ff2a85; 
            border-radius: 50%; width: 40px; height: 40px; 
            animation: spin 1s linear infinite; margin: 0 auto 20px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .final-btn { 
            display: none; width: 100%; background: linear-gradient(45deg, #00c6ff, #0072ff); 
            color: white; padding: 16px 0; border-radius: 30px; text-decoration: none; 
            font-size: 18px; font-weight: bold; margin-top: 20px; display: inline-block;
            text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); 
            transition: 0.3s;
        }
        .final-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        
        <!-- স্টেপ ১: কিউরিওসিটি এবং বয়স ভেরিফিকেশন -->
        <div class="glass-card" id="step1">
            <div class="profile-wrapper">
                <!-- এখানে আপনার ইচ্ছেমতো কোনো সুন্দর মেয়ের ছবির লিংক দিন -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Profile" class="profile-img">
                <div class="live-dot"></div>
            </div>
            <h2>Mia.Secret</h2>
            <p>Welcome to my private vault. 🤫<br>I only share my personal content with verified guests. Are you over 18?</p>
            <div class="btn-group">
                <button class="btn btn-yes" onclick="nextStep()">YES, I AM</button>
                <button class="btn btn-no" onclick="alert('Sorry, this room is strictly for 18+ visitors.')">NO</button>
            </div>
        </div>

        <!-- স্টেপ ২: ফেক ভেরিফিকেশন এবং আসল স্মার্টলিংক -->
        <div class="glass-card" id="step2">
            <div class="loader" id="loader"></div>
            <h3 id="status-text" style="color:#ccc; font-weight: normal;">Verifying secure connection...</h3>
            <!-- নিচে YOUR_SMARTLINK_HERE লেখাটি কেটে আপনার আসল CPA স্মার্টলিংক বসান -->
            <a href="https://affizer.g2afse.com/sl?id=673e05e79ec786ee35734f69&pid=3844" class="final-btn" id="final-btn" style="display: none;">Enter Private Room</a>
        </div>
        
    </div>

    <script>
        // জাভাস্ক্রিপ্ট - স্টেপ ১ থেকে স্টেপ ২ তে যাওয়ার ম্যাজিক
        function nextStep() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            
            // ২ সেকেন্ড লোডিং দেখানোর পর আসল বাটন আসবে
            setTimeout(() => {
                document.getElementById('status-text').innerHTML = "Access Granted! ✅<br><span style='font-size:14px; color:#aaa;'>Your secure room is ready.</span>";
                document.getElementById('loader').style.display = 'none';
                document.getElementById('final-btn').style.display = 'block';
            }, 2500);
        }
    </script>
</body>
</html>
